<helmet data-dc-atomics>
<style>
  .om-rv{opacity:0;transform:translateY(40px);transition:opacity 0.75s cubic-bezier(0.22,1,0.36,1),transform 0.75s cubic-bezier(0.22,1,0.36,1)}
  .om-rv.om-in{opacity:1;transform:none}
  @media (prefers-reduced-motion: reduce){.om-rv{opacity:1;transform:none;transition:none}}
</style>
<script>
(function () {
  if (window.__omCaseBoot) return;
  window.__omCaseBoot = true;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) return;
  var shown = new Set(), order = new Map(), io = null, booted = false;

  function nodeList() {
    return Array.from(document.querySelectorAll('section > *')).filter(function (n) { return n.tagName !== 'SCRIPT'; });
  }
  function index(n) {
    var p = n.parentElement;
    var i = p ? (order.get(p) || 0) : 0;
    if (p) order.set(p, i + 1);
    var cs = p ? getComputedStyle(p) : null;
    var row = cs && (cs.display === 'grid' || (cs.display === 'flex' && cs.flexDirection.indexOf('row') === 0));
    n.dataset.revealIndex = row ? String(i) : '0';
    n.classList.add('om-rv');
  }
  function reveal(n) {
    if (shown.has(n)) return;
    shown.add(n);
    var d = Math.min(Number(n.dataset.revealIndex || 0), 5) * 140;
    setTimeout(function () { n.classList.add('om-in'); }, d);
  }
  function sweep() {
    var cut = window.innerHeight * 0.75;
    nodeList().forEach(function (n) {
      if (n.dataset.revealIndex === undefined) { index(n); if (io) io.observe(n); }
      if (shown.has(n) || n.classList.contains('om-in')) return;
      if (n.getBoundingClientRect().top < cut) { reveal(n); if (io) io.unobserve(n); }
    });
  }
  function start() {
    var nodes = nodeList();
    if (!nodes.length) return false;
    booted = true;
    nodes.forEach(index);
    io = new IntersectionObserver(function (entries, obs) {
      entries.forEach(function (e) {
        if (!e.isIntersecting) return;
        reveal(e.target);
        obs.unobserve(e.target);
      });
    }, { rootMargin: '0px 0px -25% 0px', threshold: 0 });
    nodes.forEach(function (n) { io.observe(n); });
    nodes.forEach(function (n) {
      if (n.getBoundingClientRect().top < window.innerHeight * 0.92) { reveal(n); io.unobserve(n); }
    });
    window.addEventListener('scroll', sweep, { passive: true });
    window.addEventListener('resize', sweep, { passive: true });
    setInterval(sweep, 700);
    return true;
  }
  var tries = 0;
  (function tick() {
    if (!booted && !start() && ++tries < 120) return setTimeout(tick, 100);
  })();
})();
</script>
