  .om-rv.om-in{opacity:1;transform:none}
  @media (prefers-reduced-motion: reduce){.om-rv{opacity:1;transform:none;transition:none}}
</style>
<script>
(function () {
  if (window.__omCaseBoot) return;
  window.__omCaseBoot = true;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) return;
  var shown = new Set(), order = new Map(), io = null, booted = false;

  function nodeList() {
    return Array.from(document.querySelectorAll('section > *')).filter(function (n) { return n.tagName !== 'SCRIPT'; });
  }
  function index(n) {
    var p = n.parentElement;
    var i = p ? (order.get(p) || 0) : 0;
    if (p) order.set(p, i + 1);
    var cs = p ? getComputedStyle(p) : null;
    var row = cs && (cs.display === 'grid' || (cs.display === 'flex' && cs.flexDirection.indexOf('row') === 0));
    n.dataset.revealIndex = row ? String(i) : '0';
    n.classList.add('om-rv');
  }
  function reveal(n) {
    if (shown.has(n)) return;
    shown.add(n);
    var d = Math.min(Number(n.dataset.revealIndex || 0), 5) * 140;
    setTimeout(function () { n.classList.add('om-in'); }, d);
  }
  function sweep() {
    var cut = window.innerHeight * 0.75;
    nodeList().forEach(function (n) {
      if (n.dataset.revealIndex === undefined) { index(n); if (io) io.observe(n); }
      if (shown.has(n) || n.classList.contains('om-in')) return;
      if (n.getBoundingClientRect().top < cut) { reveal(n); if (io) io.unobserve(n); }
    });
  }
  function start() {
    var nodes = nodeList();
    if (!nodes.length) return false;
    booted = true;
    nodes.forEach(index);
    io = new IntersectionObserver(function (entries, obs) {
      entries.forEach(function (e) {
        if (!e.isIntersecting) return;
        reveal(e.target);
        obs.unobserve(e.target);
      });
    }, { rootMargin: '0px 0px -25% 0px', threshold: 0 });
    nodes.forEach(function (n) { io.observe(n); });
    nodes.forEach(function (n) {
      if (n.getBoundingClientRect().top < window.innerHeight * 0.92) { reveal(n); io.unobserve(n); }
    });
    window.addEventListener('scroll', sweep, { passive: true });
    window.addEventListener('resize', sweep, { passive: true });
    setInterval(sweep, 700);
    return true;
  }
  var tries = 0;
  (function tick() {
    if (!booted && !start() && ++tries < 120) return setTimeout(tick, 100);
  })();
})();
</script>

<style>
/* ===== Switch de idioma (gris, segmentado) ===== */
:root{--lg-track:#eeeef1;--lg-thumb:#ffffff;--lg-ink:#1c1c22;--lg-mut:#6b6b73}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--lg-track:#26262d;--lg-thumb:#3a3a44;--lg-ink:#f1f1f5;--lg-mut:#a9a9b3}}
:root[data-theme="dark"]{--lg-track:#26262d;--lg-thumb:#3a3a44;--lg-ink:#f1f1f5;--lg-mut:#a9a9b3}
.lg{--p:0;position:relative;display:inline-grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:999px;background:var(--lg-track);isolation:isolate;font-family:'Inter',system-ui,sans-serif;flex:none}
html[lang^="en"] .lg{--p:1}
.lg::before{content:"";position:absolute;z-index:-1;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:999px;background:var(--lg-thumb);
  box-shadow:0 1px 3px rgba(0,0,0,.14),0 0 0 1px rgba(0,0,0,.04);transform:translateX(calc(var(--p) * 100%));transition:transform .4s cubic-bezier(.22,1,.36,1)}
.lg a{text-align:center;padding:6px 13px;font-size:12.5px;font-weight:700;letter-spacing:.04em;line-height:1.2;color:var(--lg-mut);text-decoration:none;border-radius:999px;transition:color .3s}
.lg a[aria-current="true"],.lg.is-sw a[aria-current="true"]{color:var(--lg-ink)}
.lg.is-sw a{color:var(--lg-mut)}
.lg a:focus-visible{outline:2px solid var(--lg-ink);outline-offset:2px}
</style>
<script>
(function(){
  function counterpart(target){
    var p=location.pathname,inEn=/^\/en(\/|$)/.test(p);
    var base=inEn?p.replace(/^\/en/,'')||'/':p;
    var dest=target==='en'?'/en'+(base==='/'?'/':base):base;
    return dest+location.search+location.hash;
  }
  function wire(){
    document.querySelectorAll('.lg a[data-lang]').forEach(function(a){
      a.setAttribute('href',counterpart(a.getAttribute('data-lang')));
    });
  }
  document.addEventListener('click',function(e){
    var a=e.target.closest&&e.target.closest('.lg a[data-lang]');
    if(!a)return;
    var lang=a.getAttribute('data-lang');
    try{localStorage.setItem('fp-lang',lang);}catch(_){}
    if(a.getAttribute('aria-current')==='true'){e.preventDefault();return;}
    e.preventDefault();
    var box=a.closest('.lg');box.classList.add('is-sw');box.style.setProperty('--p',lang==='en'?1:0);
    setTimeout(function(){location.href=a.getAttribute('href');},260);
  });
  try{
    var saved=localStorage.getItem('fp-lang');
    if(!saved&&/^\/(index\.html)?$/.test(location.pathname)&&/^en/i.test(navigator.language||'')){
      localStorage.setItem('fp-lang','en');location.replace('/en/');
    }else if(!saved){localStorage.setItem('fp-lang',/^\/en(\/|$)/.test(location.pathname)?'en':'es');}
  }catch(_){}
  wire();
  if('MutationObserver' in window){new MutationObserver(wire).observe(document.documentElement,{childList:true,subtree:true});}
})();
</script>
